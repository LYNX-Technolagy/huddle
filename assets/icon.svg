<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Background: Haikyū orange -->
  <rect width="1024" height="1024" fill="#F56A00"/>

  <!-- Manga panel border: thick ink black frame -->
  <rect x="48" y="48" width="928" height="928" fill="none" stroke="#1A1A1A" stroke-width="32"/>

  <!-- Top accent bar -->
  <rect x="180" y="260" width="664" height="20" fill="#1A1A1A"/>

  <!-- HUDDLE wordmark -->
  <text
    x="512"
    y="560"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="180"
    font-weight="900"
    fill="#1A1A1A"
    text-anchor="middle"
    letter-spacing="8"
  >HUDDLE</text>

  <!-- Bottom accent bar -->
  <rect x="180" y="620" width="400" height="16" fill="#1A1A1A"/>

  <!-- Tagline -->
  <text
    x="512"
    y="740"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="44"
    font-weight="700"
    fill="#1A1A1A"
    text-anchor="middle"
    letter-spacing="12"
  >FIND YOUR GAME</text>

  <!-- Corner tick marks (manga panel feel) -->
  <rect x="80" y="80" width="80" height="8" fill="#1A1A1A"/>
  <rect x="80" y="80" width="8" height="80" fill="#1A1A1A"/>

  <rect x="864" y="80" width="80" height="8" fill="#1A1A1A"/>
  <rect x="936" y="80" width="8" height="80" fill="#1A1A1A"/>

  <rect x="80" y="936" width="80" height="8" fill="#1A1A1A"/>
  <rect x="80" y="864" width="8" height="80" fill="#1A1A1A"/>

  <rect x="864" y="936" width="80" height="8" fill="#1A1A1A"/>
  <rect x="936" y="864" width="8" height="80" fill="#1A1A1A"/>
</svg>